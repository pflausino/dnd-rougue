<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogadores | A Última Dungeon</title>

  <!-- Instalável como app no tablet da mesa. O manifesto responde pelo
       Chrome/Android; as metas `apple-*` pelo iPad, que ignora o manifesto na
       hora de "Adicionar à Tela de Início". -->
  <link rel="manifest" href="jogadores.webmanifest">
  <meta name="theme-color" content="#08040f">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A Última Dungeon">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="jogadores">
    <header class="jogadores__barra">
      <span class="marca">A Última Dungeon</span>

      <div class="stat">
        <span class="rotulo">Run</span>
        <span class="stat__valor" data-run>1</span>
      </div>

      <div class="stat">
        <span class="rotulo">Ouro do grupo</span>
        <span class="stat__valor stat__valor--ouro"><span data-ouro>0</span> PO</span>
      </div>

      <div class="stat">
        <span class="rotulo">Tempo restante</span>
        <span class="stat__valor stat__valor--tempo mono" data-tempo>04:00:00</span>
      </div>

      <!-- Some para quem não tem a senha: é a tela projetada para a mesa, e o
           jogador não deve ter um caminho para o painel de controle. -->
      <nav class="nav" data-exige-acesso hidden>
        <a href="index.html">Painel</a>
      </nav>
    </header>

    <!-- Bênçãos conquistadas, sempre à vista durante a run -->
    <section class="tira-bencaos" data-tira-bencaos hidden>
      <span class="rotulo">Bênçãos do grupo</span>
      <div class="tira-bencaos__lista" data-tira-lista></div>
    </section>

    <main class="jogadores__palco" data-palco>
      <div>
        <span class="rotulo" data-etapa>Entre as runs</span>
        <h1 class="palco__sala" data-titulo>Acampamento</h1>
        <p class="palco__sub" data-subtitulo>Lojas abertas</p>

        <section class="pausa" data-pausa hidden>
          <span class="rotulo" data-pausa-rotulo>Escolham a pausa desta morte</span>
          <p class="pausa__contagem mono" data-pausa-contagem hidden>05:00</p>
          <div class="pausa__opcoes" data-pausa-opcoes></div>
          <button class="btn btn--primario" type="button" data-pausa-encerrar hidden>
            Retomar a aventura
          </button>
        </section>

        <section class="lojas" data-lojas hidden>
          <span class="rotulo">Lojas do acampamento</span>
          <div class="lojas__grade" data-lojas-grade></div>
        </section>
      </div>
    </main>

    <button class="botao-canto" type="button" data-abrir-ouro>+ Ouro do loot</button>
  </div>

  <dialog class="modal" data-modal-ouro>
    <form method="dialog" class="modal__caixa" data-form-ouro>
      <span class="rotulo">Registrar loot</span>
      <h2>Ouro encontrado</h2>

      <div class="linha" data-atalhos-ouro></div>

      <label class="campo">
        <span class="rotulo">Quanto o grupo recolheu</span>
        <input type="number" min="1" step="1" inputmode="numeric" data-valor-ouro placeholder="0">
      </label>

      <p class="modal__saldo">
        Ouro do grupo: <strong class="mono"><span data-ouro-atual>0</span> PO</strong>
      </p>

      <div class="linha linha--fim">
        <button class="btn btn--fantasma" type="button" data-fechar-ouro>Cancelar</button>
        <button class="btn btn--ouro" type="submit">Adicionar</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal" data-modal-bencao>
    <div class="modal__caixa modal__caixa--bencao">
      <span class="bencao__icone bencao__icone--modal" data-bencao-icone></span>
      <div class="bencao__corpo">
        <span class="rotulo" data-bencao-tipo></span>
        <h2 data-bencao-nome></h2>
        <p class="bencao__lema" data-bencao-lema></p>
        <p class="bencao__efeito" data-bencao-efeito></p>
        <p class="bencao__restricao" data-bencao-restricao hidden></p>
        <p class="vazio" data-bencao-tipo-nota></p>
        <div class="linha linha--fim">
          <button class="btn btn--fantasma" type="button" data-fechar-bencao>Fechar</button>
          <button class="btn btn--ouro" type="button" data-consumir-bencao hidden>Consumir</button>
        </div>
      </div>
    </div>
  </dialog>

  <div class="recado" data-recado role="status" aria-live="polite"></div>

  <script src="js/state.js"></script>
  <script src="js/aviso-conexao.js"></script>
  <!-- Aqui o portão não trava nada: só decide se o link do painel aparece. -->
  <script src="js/portao.js"></script>
  <script src="data/bencaos.js"></script>
  <script src="js/jogadores.js"></script>
  <script src="js/instalavel.js"></script>
</body>
</html>
