<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mestre | A Última Dungeon</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topo">
    <div class="topo__titulo">
      <span class="marca">A Última Dungeon</span>
      <h1>Mesa do Mestre</h1>
    </div>
    <nav class="nav">
      <a href="index.html">Painel</a>
      <a href="mestre.html" aria-current="page">Mestre</a>
      <a href="jogadores.html" target="_blank" rel="noopener">Jogadores</a>
      <a href="relogio.html" target="_blank" rel="noopener">Relógio</a>
    </nav>
  </header>

  <main class="conteudo mestre">
    <!-- Relógio -->
    <section class="painel bloco">
      <div class="bloco__cabeca">
        <h2>Relógio</h2>
        <span class="selo" data-estado-relogio>Pausado</span>
      </div>

      <p class="relogio-mini mono" data-tempo>04:00:00</p>

      <div class="pilha">
        <div class="linha">
          <button class="btn btn--primario" type="button" data-alternar>Iniciar</button>
          <button class="btn btn--perigo" type="button" data-zerar>Zerar</button>
        </div>
        <div class="linha">
          <button class="btn btn--fantasma btn--pequeno" type="button" data-ajustar="-15">-15 min</button>
          <button class="btn btn--fantasma btn--pequeno" type="button" data-ajustar="-5">-5 min</button>
          <button class="btn btn--fantasma btn--pequeno" type="button" data-ajustar="5">+5 min</button>
          <button class="btn btn--fantasma btn--pequeno" type="button" data-ajustar="15">+15 min</button>
        </div>
        <div class="contador">
          <span class="rotulo">Decorrido</span>
          <span class="contador__valor" data-decorrido>00:00:00</span>
        </div>
      </div>
    </section>

    <!-- Progresso da run -->
    <section class="painel bloco">
      <div class="bloco__cabeca">
        <h2>Run</h2>
        <span class="selo" data-mortes>0 TPKs</span>
      </div>

      <div class="pilha">
        <div class="contador">
          <span class="rotulo">Tentativa</span>
          <div class="linha">
            <button class="btn btn--pequeno" type="button" data-run="-1">−</button>
            <span class="contador__valor" data-run-valor>1</span>
            <button class="btn btn--pequeno" type="button" data-run="1">+</button>
          </div>
        </div>

        <div class="contador">
          <span class="rotulo">Ouro do grupo</span>
          <span class="contador__valor contador__valor--ouro"><span data-ouro-valor>0</span> PO</span>
        </div>

        <div class="linha">
          <button class="btn btn--pequeno" type="button" data-ouro="-50">−50</button>
          <button class="btn btn--pequeno" type="button" data-ouro="-10">−10</button>
          <button class="btn btn--pequeno" type="button" data-ouro="10">+10</button>
          <button class="btn btn--pequeno" type="button" data-ouro="50">+50</button>
          <button class="btn btn--ouro btn--pequeno" type="button" data-ouro="150">+150</button>
        </div>

        <label class="campo">
          <span class="rotulo">Definir ouro</span>
          <div class="linha">
            <input type="number" min="0" step="1" data-ouro-input placeholder="0">
            <button class="btn" type="button" data-ouro-definir>Aplicar</button>
          </div>
        </label>

        <button class="btn btn--perigo btn--largo" type="button" data-tpk>Registrar TPK</button>
      </div>
    </section>

    <!-- Tela dos jogadores -->
    <section class="painel bloco">
      <div class="bloco__cabeca">
        <h2>Tela dos Jogadores</h2>
        <span class="selo" data-modo-atual>Acampamento</span>
      </div>

      <div class="campo">
        <span class="rotulo">Onde o grupo está</span>
        <div class="linha" data-modos></div>
      </div>
    </section>

    <!-- Pausas -->
    <section class="painel bloco">
      <div class="bloco__cabeca">
        <h2>Pausas</h2>
        <span class="selo" data-pausa-estado>Sem pausa</span>
      </div>

      <div class="pilha">
        <p class="relogio-mini mono" data-pausa-contagem hidden>05:00</p>
        <ul class="cotas" data-cotas></ul>
        <div class="linha">
          <button class="btn btn--primario" type="button" data-pausa-encerrar hidden>Encerrar pausa</button>
          <button class="btn btn--fantasma" type="button" data-pausa-pular hidden>Dispensar escolha</button>
        </div>
      </div>
    </section>

    <!-- Sessão -->
    <section class="painel bloco">
      <div class="bloco__cabeca">
        <h2>Sessão</h2>
      </div>
      <div class="pilha">
        <label class="campo">
          <span class="rotulo">Duração da sessão (min)</span>
          <div class="linha">
            <input type="number" min="1" step="5" data-duracao-input>
            <button class="btn" type="button" data-duracao-definir>Aplicar</button>
          </div>
        </label>
        <button class="btn btn--perigo btn--largo" type="button" data-reiniciar>Reiniciar tudo</button>
      </div>
    </section>
  </main>

  <script src="js/state.js"></script>
  <script src="js/mestre.js"></script>
</body>
</html>
