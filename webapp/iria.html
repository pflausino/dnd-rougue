<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O Véu Entre Vidas | A Última Dungeon</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topo">
    <div class="topo__titulo">
      <span class="marca">O Véu Entre Vidas</span>
      <h1>Íria Sete-Véus</h1>
    </div>
    <div class="linha" style="align-items:center;gap:1.2rem">
      <div class="stat">
        <span class="rotulo">Ouro do grupo</span>
        <span class="stat__valor stat__valor--ouro"><span data-ouro>0</span> PO</span>
      </div>
      <nav class="nav">
        <a href="jogadores.html">Voltar ao acampamento</a>
      </nav>
    </div>
  </header>

  <main class="conteudo">
    <p class="iria__fala">
      “Todas as bênçãos já passaram por estas mãos. Escolham — eu lembro de cada
      tentativa, mesmo as que vocês preferiram esquecer.”
    </p>
    <div class="vitrine" data-vitrine></div>
  </main>

  <div class="recado" data-recado role="status" aria-live="polite"></div>

  <script src="js/state.js"></script>
  <script src="js/aviso-conexao.js"></script>
  <script src="js/guarda-loja.js"></script>
  <script src="data/bencaos.js"></script>
  <script src="js/iria.js"></script>
</body>
</html>
